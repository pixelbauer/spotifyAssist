version: '3.8'

services:
  # PHP-FPM Service
  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    container_name: spotifyassist_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_IDE_CONFIG=serverName=DockerApp
      - XDEBUG_MODE=debug,develop
      - XDEBUG_CONFIG=client_host=host.docker.internal
    networks:
      - app-network

  # Nginx Webserver
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    container_name: spotifyassist_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app-network

  # Node.js für Tailwind CSS (Watch Mode)
  node:
    build:
      context: .
      dockerfile: Dockerfile
      target: node
    container_name: spotifyassist_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "npm install && npm run dev"
    networks:
      - app-network

  # MySQL Datenbank
  mysql:
    image: mysql:8.0
    container_name: spotifyassist_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: spotifyassist
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  # PHPMyAdmin (optional)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: spotifyassist_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
